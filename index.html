<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes coffres</title>
<style>
:root{--bg:#f6efe2;--ink:#3a2512;--panel:#fffaf0;--line:#d9c7a6;--green:#2f9e44;--red:#c0392b;--wood:#8a5a2b;--wood2:#6b4220;--gold:#e8b53a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1610;--ink:#f3e6cf;--panel:#2a2016;--line:#4a3a28}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center}
main{flex:1;display:flex;align-items:center;justify-content:center;gap:16px;padding:24px}
#count{font-size:clamp(72px,26vw,160px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
svg{width:clamp(56px,20vw,110px);height:auto}
footer{width:100%;max-width:420px;padding:16px 20px 28px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;justify-content:center}
button{font:inherit;border:0;border-radius:999px;cursor:pointer;color:#fff;font-weight:700}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#plus{width:68px;height:68px;font-size:40px;background:var(--green)}
#minus{height:68px;padding:0 22px;font-size:18px;background:var(--red)}
#panel{display:none;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;flex-direction:column;gap:10px}
#panel.open{display:flex}
#label{font-weight:700}
input{font:inherit;font-size:24px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
#ok{background:var(--wood);padding:12px;font-size:18px}
#cancel{background:transparent;color:var(--ink);padding:6px;font-weight:400;text-decoration:underline}
#msg{min-height:1.2em;text-align:center;color:var(--red);font-size:14px}
</style>
</head>
<body>
<main>
  <div id="count">0</div>
  <svg viewBox="0 0 120 100" aria-label="Coffre" role="img">
    <path d="M10 42 Q10 12 60 12 Q110 12 110 42 Z" fill="#8a5a2b" stroke="#4a2c12" stroke-width="4" stroke-linejoin="round"/>
    <rect x="10" y="42" width="100" height="48" rx="4" fill="#6b4220" stroke="#4a2c12" stroke-width="4"/>
    <rect x="10" y="38" width="100" height="8" fill="#e8b53a" stroke="#4a2c12" stroke-width="3"/>
    <rect x="28" y="12" width="9" height="78" fill="#e8b53a" opacity=".85"/>
    <rect x="83" y="12" width="9" height="78" fill="#e8b53a" opacity=".85"/>
    <rect x="49" y="34" width="22" height="24" rx="4" fill="#e8b53a" stroke="#4a2c12" stroke-width="3"/>
    <circle cx="60" cy="44" r="3.5" fill="#4a2c12"/>
    <rect x="58.5" y="46" width="3" height="7" fill="#4a2c12"/>
  </svg>
</main>
<footer>
  <div id="panel">
    <div id="label"></div>
    <input id="num" type="number" inputmode="numeric" min="1" step="1" placeholder="Nombre de coffres">
    <button id="ok">Valider</button>
    <button id="cancel">Annuler</button>
  </div>
  <div id="msg" role="status"></div>
  <div class="row">
    <button id="plus" aria-label="Ajouter des coffres">+</button>
    <button id="minus">Supprimer</button>
  </div>
</footer>
<script>
let count=0,mode=null;
try{count=parseInt(localStorage.getItem("coffres"))||0}catch(e){}
const $=id=>document.getElementById(id);
function render(){$("count").textContent=count;try{localStorage.setItem("coffres",count)}catch(e){}}
function open(m){mode=m;$("label").textContent=m==="add"?"Combien de coffres ajouter ?":"Combien de coffres supprimer ?";$("num").value="";$("msg").textContent="";$("panel").classList.add("open");$("num").focus()}
function close(){mode=null;$("panel").classList.remove("open")}
$("plus").onclick=()=>open("add");
$("minus").onclick=()=>open("remove");
$("cancel").onclick=close;
$("ok").onclick=()=>{
  const n=parseInt($("num").value);
  if(!n||n<1){$("msg").textContent="Entre un nombre entier supérieur à 0.";return}
  if(mode==="remove"&&n>count){$("msg").textContent="Tu n’as que "+count+" coffre"+(count>1?"s":"")+".";return}
  count+=mode==="add"?n:-n;render();close();
};
$("num").addEventListener("keydown",e=>{if(e.key==="Enter")$("ok").click()});
render();
</script>
</body>
</html>
